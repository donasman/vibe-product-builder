<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>사주 AI 도사 | 현대적인 명리 분석</title>
  <link href='/style.css' rel='stylesheet'>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lunar-javascript/1.6.12/lunar.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- 입력 섹션 -->
    <div class="calendar-card">
      <div class="calendar-header">
        <button id="prevMonth" class="nav-btn" title="이전 달">&larr;</button>
        <div class="header-selects">
          <select id="yearSelectHeader"></select>
          <select id="monthSelectHeader"></select>
        </div>
        <button id="nextMonth" class="nav-btn" title="다음 달">&rarr;</button>
      </div>

      <!-- 달력 -->
      <div class="calendar-weekdays">
        <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
      </div>
      <div id="calendarDays" class="calendar-days"></div>
      
      <!-- 시간 선택 -->
      <div class="time-selection">
        <div class="input-group">
          <label>태어난 시간</label>
          <select id="hourSelect"></select>
        </div>
        <div class="input-group">
          <label>분</label>
          <select id="minuteSelect"></select>
        </div>
      </div>

      <div class="calendar-footer">
        <button id="confirmBtn" class="confirm-btn" disabled>사주 분석하기</button>
        <div class="selected-date-info">
          선택된 날짜: <span id="selectedDateDisplay">날짜를 선택해주세요</span>
        </div>
      </div>
    </div>

    <!-- 결과 섹션 -->
    <div id="resultContainer" class="result-container hidden">
      <h3 style="text-align: center; margin-bottom: 32px; font-weight: 800;">당신의 사주팔자</h3>
      
      <div class="saju-table">
        <div class="pillar" id="hourPillar">
          <div class="label">시주 (時)</div>
          <div class="stem"></div>
          <div class="branch"></div>
        </div>
        <div class="pillar" id="dayPillar">
          <div class="label">일주 (日)</div>
          <div class="stem"></div>
          <div class="branch"></div>
        </div>
        <div class="pillar" id="monthPillar">
          <div class="label">월주 (月)</div>
          <div class="stem"></div>
          <div class="branch"></div>
        </div>
        <div class="pillar" id="yearPillar">
          <div class="label">연주 (年)</div>
          <div class="stem"></div>
          <div class="branch"></div>
        </div>
      </div>

      <div id="sajuText" class="saju-text"></div>
      
      <div class="interpretation-section">
        <!-- AI 분석 탭 -->
        <div class="analysis-tabs">
          <button class="tab-btn active" data-topic="personality">성격</button>
          <button class="tab-btn" data-topic="job">직업운</button>
          <button class="tab-btn" data-topic="love">연애운</button>
          <button class="tab-btn" data-topic="wealth">재물운</button>
        </div>

        <!-- 로딩 -->
        <div id="aiLoading" class="ai-loading hidden">
          <div class="spinner"></div>
          <p style="font-weight: 700; color: var(--primary);">AI 도사가 운명의 흐름을 읽는 중입니다...</p>
        </div>

        <!-- AI 결과 -->
        <div id="aiResultArea" class="ai-result-area">
          <div id="aiContent" class="markdown-body"></div>
        </div>

        <h4>📊 오행 에너지 분포</h4>
        <div id="elementsStats" class="elements-stats"></div>
        
        <!-- 성격 분석 카드는 JS에서 동적으로 aiContent에 삽입됩니다. -->
      </div>
    </div>
  </div>
  <script defer type="text/javascript" src="/main.js"></script>
</body>
</html>
