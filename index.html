<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>만세력 (사주팔자) AI 도사</title>
  <link href='/style.css' rel='stylesheet'>
  <!-- lunar-javascript library for Saju calculation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lunar-javascript/1.6.12/lunar.js"></script>
  <!-- marked.js for AI markdown rendering -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
</head>
<body>
  <div class="app-container">
    <div class="calendar-card">
      <div class="calendar-header">
        <button id="prevMonth" class="nav-btn">&larr;</button>
        <div class="header-selects">
          <select id="yearSelectHeader"></select>
          <select id="monthSelectHeader"></select>
        </div>
        <button id="nextMonth" class="nav-btn">&rarr;</button>
        <button id="settingsBtn" class="settings-btn" title="API 설정">⚙️</button>
      </div>

      <div id="settingsModal" class="modal hidden">
        <div class="modal-content">
          <h3>Gemini API 설정</h3>
          <p>Google AI Studio에서 발급받은 API 키를 입력해주세요.</p>
          <input type="password" id="apiKeyInput" placeholder="AIza..." />
          <div class="modal-btns">
            <button id="saveKeyBtn" class="confirm-btn">저장</button>
            <button id="closeModalBtn" class="nav-btn">닫기</button>
          </div>
        </div>
      </div>
      </div>

      <div class="calendar-weekdays">
        <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
      </div>
      <div id="calendarDays" class="calendar-days"></div>
      
      <div class="time-selection">
        <div class="input-group">
          <label for="hourSelect">시간</label>
          <select id="hourSelect"></select>
        </div>
        <div class="input-group">
          <label for="minuteSelect">분</label>
          <select id="minuteSelect"></select>
        </div>
      </div>

      <div class="calendar-footer">
        <p>선택된 날짜: <span id="selectedDateDisplay">날짜를 선택하세요</span></p>
        <button id="confirmBtn" class="confirm-btn" disabled>만세력 확인하기</button>
      </div>
    </div>

    <div id="resultContainer" class="result-container hidden">
      <h3>사주팔자 결과</h3>
      <div class="saju-table">
        <div class="pillar" id="hourPillar">
          <div class="label">시주</div>
          <div class="stem"></div>
          <div class="branch"></div>
        </div>
        <div class="pillar" id="dayPillar">
          <div class="label">일주</div>
          <div class="stem"></div>
          <div class="branch"></div>
        </div>
        <div class="pillar" id="monthPillar">
          <div class="label">월주</div>
          <div class="stem"></div>
          <div class="branch"></div>
        </div>
        <div class="pillar" id="yearPillar">
          <div class="label">연주</div>
          <div class="stem"></div>
          <div class="branch"></div>
        </div>
      </div>
      <div id="sajuText" class="saju-text"></div>
      
      <div class="interpretation-section">
        <button id="aiAnalysisBtn" class="ai-btn">✨ AI 전문가 사주 감명 받기</button>
        
        <div id="aiLoading" class="ai-loading hidden">
          <div class="spinner"></div>
          <p>Gemini 도사가 사주를 풀이하는 중입니다...</p>
        </div>

        <div id="aiResultArea" class="ai-result-area hidden">
          <h4>AI 심층 분석 보고서</h4>
          <div id="aiContent" class="markdown-body"></div>
        </div>

        <h4>오행 분포 통계</h4>
        <div id="elementsStats" class="elements-stats"></div>
        
        <div class="personality-card">
          <h4 id="dayMasterTitle">나의 성향 분석</h4>
          <p id="personalityText">사주를 분석 중입니다...</p>
        </div>
      </div>
    </div>
  </div>
  <script defer type="text/javascript" src="/main.js"></script>
</body>
</html>
